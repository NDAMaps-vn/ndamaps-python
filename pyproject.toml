[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ndamaps"
version = "0.1.0"
description = "Official Python SDK for NDAMaps — Vietnam's national digital map platform API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "NDAMaps", email = "dev@ndamaps.vn" },
]
keywords = ["ndamaps", "maps", "geocoding", "vietnam", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.21",
    "respx>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["ndamaps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
